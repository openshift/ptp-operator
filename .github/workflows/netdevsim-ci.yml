# CI for ptp-operator with netdevsim DKMS modules.
# Builds DKMS modules from netdevsim-dkms, then runs ptp-operator e2e
# tests using the checked-out ptp-operator source.
#
# Reusable: linuxptp-daemon runs this workflow via `uses:` instead of
# keeping an adapted copy (other callers are rejected for now — the
# image build assumes the linuxptp-daemon source layout). Self
# vs. called mode is detected structurally (job.workflow_repository vs
# GITHUB_REPOSITORY, so forks of this repo still run in self mode). When
# called, the checkout is the caller's source code: it is stashed at
# /tmp/caller-repo, this repository is cloned as the CI harness pinned
# to job.workflow_sha (the exact commit the workflow was resolved from),
# and Dockerfile.lptpd is patched to build the caller's code into the
# daemon image. Harness fixes then only need to land here.

name: netdevsim CI

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DKMS_PKG: netdevsim
  DKMS_VER: "6.9.5"
  DKMS_REPO: https://github.com/redhat-cne/netdevsim-dkms.git
  DKMS_BRANCH: main
  # Optional: set to "true" to stream run-on-vm child command logs.
  # RUN_ON_VM_VERBOSE: "true"

jobs:
  # ------------------------------------------------------------------
  # DKMS build + smoke tests (every PR and workflow_dispatch)
  # ------------------------------------------------------------------
  dkms-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Runner info
        run: |
          echo "CPUs: $(nproc)"
          echo "RAM: $(free -h | awk '/Mem:/{print $2}')"
          echo "Kernel: $(uname -r)"

      - name: Clone netdevsim-dkms
        run: git clone --depth 1 --branch "${DKMS_BRANCH}" "${DKMS_REPO}" /tmp/netdevsim-dkms

      - name: Install DKMS dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dkms gcc make ethtool linuxptp \
            linux-headers-$(uname -r)
          # gnss.ko lives in linux-modules-extra on Azure kernels, but the
          # package is not published for every runner ABI — install when
          # available, skip otherwise.
          if apt-cache show linux-modules-extra-$(uname -r) >/dev/null 2>&1; then
            sudo apt-get install -y linux-modules-extra-$(uname -r)
          else
            echo "::warning::linux-modules-extra-$(uname -r) not available — continuing without it"
          fi

      - name: Install DKMS source tree
        run: |
          sudo mkdir -p /usr/src/${DKMS_PKG}-${DKMS_VER}
          sudo cp -a /tmp/netdevsim-dkms/Makefile /tmp/netdevsim-dkms/dkms.conf \
            /tmp/netdevsim-dkms/install-udev-rule.sh /tmp/netdevsim-dkms/99-nsim-ptp.rules \
            /tmp/netdevsim-dkms/include /tmp/netdevsim-dkms/ptp \
            /tmp/netdevsim-dkms/dpll /tmp/netdevsim-dkms/netdevsim \
            /usr/src/${DKMS_PKG}-${DKMS_VER}/

      - name: DKMS add + build + install
        id: build
        run: |
          sudo dkms add ${DKMS_PKG}/${DKMS_VER}
          if sudo dkms build ${DKMS_PKG}/${DKMS_VER} 2>&1; then
            echo "status=ok" >> "$GITHUB_OUTPUT"
          else
            echo "status=fail" >> "$GITHUB_OUTPUT"
            echo "::warning::DKMS build failed — dumping make.log"
            sudo cat /var/lib/dkms/${DKMS_PKG}/${DKMS_VER}/build/make.log || true
            exit 1
          fi
          sudo dkms install --force ${DKMS_PKG}/${DKMS_VER}
          sudo cp /tmp/netdevsim-dkms/99-nsim-ptp.rules /etc/udev/rules.d/
          sudo udevadm control --reload-rules

      - name: Load modules
        id: load
        run: |
          set -e
          sudo modprobe gnss           && echo "gnss loaded"           || echo "gnss skipped"
          sudo modprobe nsim_ptp       && echo "nsim_ptp loaded"
          sudo modprobe nsim_ptp_mock  && echo "nsim_ptp_mock loaded"
          sudo modprobe nsim_dpll      && echo "nsim_dpll loaded"
          sudo modprobe netdevsim && echo "netdevsim loaded"
          lsmod | grep -E 'nsim_ptp|nsim_dpll|netdevsim|gnss' || true
          sudo chmod 666 /dev/nsim_ptp* 2>/dev/null || true
          echo "load_ok=true" >> "$GITHUB_OUTPUT"

      - name: Smoke test — create netdevsim device
        if: steps.load.outputs.load_ok == 'true'
        run: |
          set -euo pipefail
          if [ ! -r /sys/module/netdevsim/parameters/pci_bus_nr ]; then
            echo "ERROR: netdevsim is not loaded; cannot create a fake PCI root" >&2
            exit 1
          fi
          BUS_NR=$(cat /sys/module/netdevsim/parameters/pci_bus_nr)
          if ! [[ "$BUS_NR" =~ ^[0-9]+$ ]]; then
            echo "ERROR: netdevsim did not select a PCI bus (pci_bus_nr=${BUS_NR})" >&2
            exit 1
          fi
          BUS=$(printf "%02x" "$BUS_NR")
          BUS_DEVICES=$(ls /sys/bus/pci/devices/ 2>/dev/null | grep "^0000:${BUS}:" || true)
          if [ -z "$BUS_DEVICES" ]; then
            echo "ERROR: netdevsim did not create a fake PCI root bus on 0000:${BUS}" >&2
            exit 1
          fi
          FAKE_ROOT=$(printf '%s\n' "$BUS_DEVICES" | grep "^0000:${BUS}:00\.0" | head -1 || true)
          DOMAIN="${FAKE_ROOT:+$(echo "$FAKE_ROOT" | cut -d: -f1)}"
          : "${DOMAIN:=0000}"
          PCI_ADDR="${DOMAIN}:${BUS}:02.0"
          echo "Using PCI address: ${PCI_ADDR}"
          echo "1 ${PCI_ADDR} 1" | sudo tee /sys/bus/netdevsim/new_device
          sleep 1
          ls /sys/bus/netdevsim/devices/netdevsim1/

      - name: Smoke test — verify PTP clock
        if: steps.load.outputs.load_ok == 'true'
        run: |
          set -euo pipefail
          ls /sys/class/nsim_ptp/
          ls -la /dev/nsim_ptp* /dev/ptp* 2>/dev/null || echo "No PTP devices found"
          readlink /dev/ptp0 2>/dev/null | grep -q nsim_ptp \
            && echo "OK: /dev/ptp0 -> $(readlink /dev/ptp0)" \
            || echo "WARN: /dev/ptp0 symlink not found"

      - name: Smoke test — verify ethtool PHC
        if: steps.load.outputs.load_ok == 'true'
        run: |
          BUS_NR=$(cat /sys/module/netdevsim/parameters/pci_bus_nr 2>/dev/null || echo 31)
          BUS=$(printf "%02x" "$BUS_NR")
          FAKE_ROOT=$(ls /sys/bus/pci/devices/ 2>/dev/null | grep "^0000:${BUS}:00\.0" | head -1 || true)
          DOMAIN="${FAKE_ROOT:+$(echo "$FAKE_ROOT" | cut -d: -f1)}"
          : "${DOMAIN:=0000}"
          IFACE=$(ls /sys/bus/pci/devices/${DOMAIN}:${BUS}:02.0/net/ 2>/dev/null | head -1)
          [ -n "$IFACE" ] && ethtool -T "$IFACE" || echo "WARN: No interface found"

      - name: Cleanup
        if: always()
        run: |
          echo "1" | sudo tee /sys/bus/netdevsim/del_device 2>/dev/null || true
          sudo rmmod netdevsim nsim_dpll nsim_ptp_mock nsim_ptp 2>/dev/null || true
          sudo dkms remove ${DKMS_PKG}/${DKMS_VER} --all 2>/dev/null || true

      - name: Summary
        if: always()
        run: |
          echo "## DKMS Smoke Tests (ubuntu-24.04)" >> "$GITHUB_STEP_SUMMARY"
          echo "- OS: ubuntu-24.04" >> "$GITHUB_STEP_SUMMARY"
          echo "- Kernel: $(uname -r)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build: ${{ steps.build.outputs.status || 'unknown' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Load: ${{ steps.load.outputs.load_ok || 'false' }}" >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------
  # ptp-operator: build images once and upload as artifact
  # ------------------------------------------------------------------
  ptp-images:
    needs: dkms-test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Runner info
        run: |
          echo "CPUs: $(nproc)"
          echo "RAM: $(free -h | awk '/Mem:/{print $2}')"
          echo "Kernel: $(uname -r)"

      - uses: actions/checkout@v5

      - name: Prepare CI harness
        id: harness
        env:
          # job.workflow_* identify the workflow file that defines this
          # job: in a called workflow they point at the CALLED workflow,
          # unlike github.workflow_ref / GITHUB_WORKFLOW_REF which point
          # at the caller's file.
          JOB_WORKFLOW_REPO: ${{ job.workflow_repository }}
          JOB_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          [ -n "${JOB_WORKFLOW_REPO}" ] && [ -n "${JOB_WORKFLOW_SHA}" ] \
            || { echo "ERROR: job.workflow_* context properties are not set" >&2; exit 1; }
          if [ "${JOB_WORKFLOW_REPO}" = "${GITHUB_REPOSITORY}" ]; then
            # Running in the repository that defines this workflow
            # (own PRs and dispatches, including on forks): the checkout
            # already is the CI harness.
            [ -f "$GITHUB_WORKSPACE/scripts/run-on-vm.sh" ] \
              || { echo "ERROR: self-mode checkout has no scripts/run-on-vm.sh" >&2; exit 1; }
            echo "mode=self" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Called from another repository: the checkout is the caller's
          # source code. Keep it for the image build and fetch the CI
          # harness pinned to job.workflow_sha — the exact commit this
          # workflow was resolved from — so the scripts always match the
          # workflow file even if the called branch moves mid-run.
          echo "mode=called" >> "$GITHUB_OUTPUT"
          mv "$GITHUB_WORKSPACE" /tmp/caller-repo
          echo "Fetching harness from ${JOB_WORKFLOW_REPO}@${JOB_WORKFLOW_SHA}"
          git init -q "$GITHUB_WORKSPACE"
          if ! git -C "$GITHUB_WORKSPACE" fetch --depth 1 \
              "https://github.com/${JOB_WORKFLOW_REPO}.git" "${JOB_WORKFLOW_SHA}"; then
            # Exact-SHA fetch refused: fall back to fetching all refs.
            git -C "$GITHUB_WORKSPACE" fetch \
              "https://github.com/${JOB_WORKFLOW_REPO}.git" \
              '+refs/heads/*:refs/remotes/harness/*' '+refs/tags/*:refs/tags/harness/*'
          fi
          git -C "$GITHUB_WORKSPACE" checkout --detach "${JOB_WORKFLOW_SHA}"
          [ -f "$GITHUB_WORKSPACE/scripts/run-on-vm.sh" ] \
            || { echo "ERROR: harness clone has no scripts/run-on-vm.sh" >&2; exit 1; }

      - name: Build daemon and CEP images from the caller's source
        if: steps.harness.outputs.mode == 'called'
        run: |
          set -euo pipefail
          # Build the daemon and CEP images from the caller's checkout
          # instead of cloning linuxptp-daemon main, so the images match
          # the exact commit under test. The build context is the repo
          # root (see ptp-tools/Makefile), so the source must live
          # inside it.
          #
          # The image build only knows the linuxptp-daemon source layout
          # (Dockerfile.lptpd and Dockerfile.cep both run make in it);
          # reject other callers instead of failing obscurely inside
          # the image build. addons/ (hardware plugins) is the marker
          # for a linuxptp-daemon checkout.
          [ -d /tmp/caller-repo/addons ] \
            || { echo "ERROR: called-mode image builds are only supported for linuxptp-daemon callers (no addons/ in the caller checkout)" >&2; exit 1; }
          rm -rf /tmp/caller-repo/.git
          cp -a /tmp/caller-repo "$GITHUB_WORKSPACE/linuxptp-daemon-src"
          for df in Dockerfile.lptpd Dockerfile.cep; do
            sed -i "s|^RUN git clone .*linuxptp-daemon.*|COPY linuxptp-daemon-src/ /go/src/github.com/k8snetworkplumbingwg/linuxptp-daemon|" \
              "$GITHUB_WORKSPACE/ptp-tools/$df"
            # sed exits 0 even on no match: fail loudly if the patch
            # did not apply, otherwise the image would silently be built
            # from linuxptp-daemon main instead of the caller's source.
            grep -q '^COPY linuxptp-daemon-src/' "$GITHUB_WORKSPACE/ptp-tools/$df" \
              || { echo "ERROR: $df patch did not apply" >&2; exit 1; }
          done
          echo "=== Patched Dockerfiles (daemon + CEP from the caller's checkout) ==="
          grep -n "linuxptp-daemon-src" \
            "$GITHUB_WORKSPACE/ptp-tools/Dockerfile.lptpd" \
            "$GITHUB_WORKSPACE/ptp-tools/Dockerfile.cep"

      - name: Install podman 5.x
        run: |
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL "https://download.opensuse.org/repositories/devel:/kubic:/libcontainers:/unstable/xUbuntu_$(lsb_release -rs)/Release.key" \
            | gpg --dearmor | sudo tee /etc/apt/keyrings/devel_kubic_libcontainers_unstable.gpg > /dev/null
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/devel_kubic_libcontainers_unstable.gpg] \
            https://download.opensuse.org/repositories/devel:/kubic:/libcontainers:/unstable/xUbuntu_$(lsb_release -rs)/ /" \
            | sudo tee /etc/apt/sources.list.d/devel:kubic:libcontainers:unstable.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y podman
          podman --version
          # The kubic repo may not carry a crun newer than the distro's
          # 1.14.1 which rejects OCI runtime spec v1.2.1 from podman 5.x.
          # Install crun >= 1.14.3 from upstream GitHub releases.
          CRUN_VER=1.19.1
          sudo curl -fsSL -o /usr/bin/crun \
            "https://github.com/containers/crun/releases/download/${CRUN_VER}/crun-${CRUN_VER}-linux-amd64"
          sudo chmod +x /usr/bin/crun
          crun --version | head -1
          # Serialize podman CLI via one API server (avoids Kind exec SQLite deadlock).
          sudo bash "$GITHUB_WORKSPACE/scripts/start-podman-api-service.sh"

      - name: Copy checkout to /root/ptp-operator
        run: sudo cp -a "$GITHUB_WORKSPACE" /root/ptp-operator

      - name: "Build images and export tarball"
        run: |
          sudo bash -l <<'BUILD'
          set -euo pipefail
          set -x
          export PATH=/usr/local/ptp-podman-wrap:/usr/local/bin:/usr/local/go/bin:/root/go/bin:$PATH
          export KIND_EXPERIMENTAL_PROVIDER=podman

          VM_IP=$(hostname -I | awk '{print $1}')
          cd /root/ptp-operator/scripts
          ./run-on-vm.sh --dkms --images "${VM_IP}"

          rm -rf /tmp/go-build* /root/.cache/go-build
          BUILD

      - name: Upload image tarball
        uses: actions/upload-artifact@v7
        with:
          name: ptp-images
          path: /tmp/ptp-images.tar
          retention-days: 1

  # ------------------------------------------------------------------
  # ptp-operator: one parallel runner per scenario
  # ------------------------------------------------------------------
  ptp-test:
    needs: ptp-images
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PTP_GO_VERSION: go1.27.4
    name: "ptp-test (${{ matrix.mode }}${{ matrix.auth && '-auth' || '' }})"
    strategy:
      fail-fast: false
      matrix:
        mode: [oc, bc, dualnicbc, dualnicbcha, dualfollower, tgm, tgmoc, tgmbc]
        auth: [false]
        include:
          # OC with PTP authentication enabled
          - mode: oc
            auth: true
    steps:
      - name: "Runner info (${{ matrix.mode }})"
        run: |
          echo "CPUs: $(nproc)"
          echo "RAM: $(free -h | awk '/Mem:/{print $2}')"
          echo "Kernel: $(uname -r)"

      - uses: actions/checkout@v5

      - name: Prepare CI harness
        env:
          # job.workflow_* identify the workflow file that defines this
          # job: in a called workflow they point at the CALLED workflow,
          # unlike github.workflow_ref / GITHUB_WORKFLOW_REF which point
          # at the caller's file.
          JOB_WORKFLOW_REPO: ${{ job.workflow_repository }}
          JOB_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          [ -n "${JOB_WORKFLOW_REPO}" ] && [ -n "${JOB_WORKFLOW_SHA}" ] \
            || { echo "ERROR: job.workflow_* context properties are not set" >&2; exit 1; }
          if [ "${JOB_WORKFLOW_REPO}" = "${GITHUB_REPOSITORY}" ]; then
            # Running in the repository that defines this workflow
            # (own PRs and dispatches, including on forks): the checkout
            # already is the CI harness.
            [ -f "$GITHUB_WORKSPACE/scripts/run-on-vm.sh" ] \
              || { echo "ERROR: self-mode checkout has no scripts/run-on-vm.sh" >&2; exit 1; }
            exit 0
          fi
          # Called from another repository: the checkout is the caller's
          # source code (not needed in this job). Stash it with mv — rm
          # would delete this step's own working directory — and fetch
          # the CI harness pinned to job.workflow_sha — the exact commit
          # this workflow was resolved from — so the scripts always match
          # the workflow file even if the called branch moves mid-run.
          mv "$GITHUB_WORKSPACE" /tmp/caller-repo
          echo "Fetching harness from ${JOB_WORKFLOW_REPO}@${JOB_WORKFLOW_SHA}"
          git init -q "$GITHUB_WORKSPACE"
          if ! git -C "$GITHUB_WORKSPACE" fetch --depth 1 \
              "https://github.com/${JOB_WORKFLOW_REPO}.git" "${JOB_WORKFLOW_SHA}"; then
            # Exact-SHA fetch refused: fall back to fetching all refs.
            git -C "$GITHUB_WORKSPACE" fetch \
              "https://github.com/${JOB_WORKFLOW_REPO}.git" \
              '+refs/heads/*:refs/remotes/harness/*' '+refs/tags/*:refs/tags/harness/*'
          fi
          git -C "$GITHUB_WORKSPACE" checkout --detach "${JOB_WORKFLOW_SHA}"
          [ -f "$GITHUB_WORKSPACE/scripts/run-on-vm.sh" ] \
            || { echo "ERROR: harness clone has no scripts/run-on-vm.sh" >&2; exit 1; }

      - name: Cache kustomize
        uses: actions/cache@v4
        with:
          path: bin/kustomize
          key: kustomize-5.4.2-${{ runner.os }}-${{ runner.arch }}

      - name: Install kustomize
        run: |
          if [ -s bin/kustomize ]; then
            bin/kustomize version
            exit 0
          fi
          arch="$(dpkg --print-architecture)"
          case "$arch" in
            amd64) asset="kustomize_v5.4.2_linux_amd64.tar.gz" ;;
            arm64) asset="kustomize_v5.4.2_linux_arm64.tar.gz" ;;
            *) echo "unsupported architecture: $arch" >&2; exit 1 ;;
          esac
          mkdir -p bin
          curl -fsSL --retry 5 --retry-delay 10 -o /tmp/kustomize.tar.gz \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.2/${asset}"
          tar -xzf /tmp/kustomize.tar.gz -C bin kustomize
          chmod +x bin/kustomize
          bin/kustomize version

      - name: Cache Go modules and build
        uses: actions/cache@v4
        with:
          path: |
            /tmp/ptp-go-cache/build
            /tmp/ptp-go-cache/mod
            /tmp/ptp-go-cache/bin
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache Go toolchain
        uses: actions/cache@v4
        with:
          path: /tmp/ptp-go-cache/toolchain
          key: go-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ env.PTP_GO_VERSION }}

      - name: Install podman 5.x
        run: |
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL "https://download.opensuse.org/repositories/devel:/kubic:/libcontainers:/unstable/xUbuntu_$(lsb_release -rs)/Release.key" \
            | gpg --dearmor | sudo tee /etc/apt/keyrings/devel_kubic_libcontainers_unstable.gpg > /dev/null
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/devel_kubic_libcontainers_unstable.gpg] \
            https://download.opensuse.org/repositories/devel:/kubic:/libcontainers:/unstable/xUbuntu_$(lsb_release -rs)/ /" \
            | sudo tee /etc/apt/sources.list.d/devel:kubic:libcontainers:unstable.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y podman
          podman --version
          # The kubic repo may not carry a crun newer than the distro's
          # 1.14.1 which rejects OCI runtime spec v1.2.1 from podman 5.x.
          # Install crun >= 1.14.3 from upstream GitHub releases.
          CRUN_VER=1.19.1
          sudo curl -fsSL -o /usr/bin/crun \
            "https://github.com/containers/crun/releases/download/${CRUN_VER}/crun-${CRUN_VER}-linux-amd64"
          sudo chmod +x /usr/bin/crun
          crun --version | head -1
          # Serialize podman CLI via one API server (avoids Kind exec SQLite deadlock).
          sudo bash "$GITHUB_WORKSPACE/scripts/start-podman-api-service.sh"

      - name: Install OpenShift CLI (oc)
        run: |
          if ! command -v oc &>/dev/null; then
            curl -sLO https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz
            sudo tar xzf openshift-client-linux.tar.gz -C /usr/local/bin oc kubectl
            rm -f openshift-client-linux.tar.gz
          fi
          oc version --client

      - name: Install DKMS dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dkms gcc make ethtool linuxptp \
            linux-headers-$(uname -r)
          # Best-effort: linux-modules-extra is not published for every ABI.
          if apt-cache show linux-modules-extra-$(uname -r) >/dev/null 2>&1; then
            sudo apt-get install -y linux-modules-extra-$(uname -r)
          else
            echo "::warning::linux-modules-extra-$(uname -r) not available — continuing without it"
          fi

      - name: Clone and install DKMS modules
        run: |
          git clone --depth 1 --branch "${DKMS_BRANCH}" "${DKMS_REPO}" /tmp/netdevsim-dkms
          sudo mkdir -p /usr/src/${DKMS_PKG}-${DKMS_VER}
          sudo cp -a /tmp/netdevsim-dkms/Makefile /tmp/netdevsim-dkms/dkms.conf \
            /tmp/netdevsim-dkms/install-udev-rule.sh /tmp/netdevsim-dkms/99-nsim-ptp.rules \
            /tmp/netdevsim-dkms/include /tmp/netdevsim-dkms/ptp \
            /tmp/netdevsim-dkms/dpll /tmp/netdevsim-dkms/netdevsim \
            /usr/src/${DKMS_PKG}-${DKMS_VER}/
          sudo dkms add ${DKMS_PKG}/${DKMS_VER}
          sudo dkms build ${DKMS_PKG}/${DKMS_VER}
          sudo dkms install --force ${DKMS_PKG}/${DKMS_VER}
          sudo cp /tmp/netdevsim-dkms/99-nsim-ptp.rules /etc/udev/rules.d/
          sudo udevadm control --reload-rules

      - name: Copy checkout to /root/ptp-operator
        run: sudo cp -a "$GITHUB_WORKSPACE" /root/ptp-operator

      - name: Download image tarball
        uses: actions/download-artifact@v7
        with:
          name: ptp-images
          path: /tmp

      - name: "Load images into local registry"
        run: |
          sudo bash -l <<'LOAD'
          set -euo pipefail
          set -x
          export PATH=/usr/local/ptp-podman-wrap:/usr/local/bin:/usr/local/go/bin:/root/go/bin:$PATH
          export KIND_EXPERIMENTAL_PROVIDER=podman

          VM_IP=$(hostname -I | awk '{print $1}')
          cd /root/ptp-operator/scripts
          ./run-on-vm.sh --dkms --load /tmp/ptp-images.tar "${VM_IP}"
          LOAD

      - name: "Free disk space before tests"
        run: |
          sudo bash -l <<'CLEANUP'
          set -euo pipefail
          rm -rf /tmp/ptp-images.tar /tmp/ptp-images-load
          rm -rf /tmp/go-build* /var/cache/apt /root/.cache
          df -h
          CLEANUP

      - name: "Run scenario: ${{ matrix.mode }}"
        run: |
          sudo bash -l <<'DEPLOY'
          set -euo pipefail
          set -x
          export PTP_GO_VERSION="${{ env.PTP_GO_VERSION }}"
          export GOCACHE=/tmp/ptp-go-cache/build
          export GOMODCACHE=/tmp/ptp-go-cache/mod
          export GOBIN=/tmp/ptp-go-cache/bin
          export PATH="$GOBIN:/usr/local/ptp-podman-wrap:/usr/local/bin:/usr/local/go/bin:/root/go/bin:$PATH"
          mkdir -p "$GOCACHE" "$GOMODCACHE" "$GOBIN"
          export KIND_EXPERIMENTAL_PROVIDER=podman
          export ENABLE_CEPV2=true
          export PTP_AUTH_ENABLED=${{ matrix.auth }}

          VM_IP=$(hostname -I | awk '{print $1}')
          cd /root/ptp-operator/scripts
          ./run-on-vm.sh --dkms --deploy "${VM_IP}" --mode "${{ matrix.mode }}" "${VM_IP}"
          DEPLOY

      - name: Make Go cache readable
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" /tmp/ptp-go-cache 2>/dev/null || true

      - name: "Collect Kubernetes debug info"
        if: always()
        run: |
          sudo bash -l <<'DEBUGINFO'
          set -x
          export PATH=/usr/local/ptp-podman-wrap:/usr/local/bin:/usr/local/go/bin:/root/go/bin:$PATH
          mkdir -p /tmp/artifacts/k8s-debug
          kubectl get pods -n openshift-ptp -o wide \
            > /tmp/artifacts/k8s-debug/pods.txt 2>&1 || true
          kubectl get events -n openshift-ptp \
            --sort-by=.metadata.creationTimestamp \
            > /tmp/artifacts/k8s-debug/events.txt 2>&1 || true
          kubectl describe pods -n openshift-ptp -l app=linuxptp-daemon \
            > /tmp/artifacts/k8s-debug/linuxptp-daemon-describe.txt 2>&1 || true
          for pod in $(kubectl get pods -n openshift-ptp -l app=linuxptp-daemon \
              -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
            kubectl logs -n openshift-ptp "$pod" -c cloud-event-proxy --previous \
              > "/tmp/artifacts/k8s-debug/${pod}-cep-previous.txt" 2>&1 || true
          done
          DEBUGINFO

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ptp-artifacts-${{ matrix.mode }}${{ matrix.auth && '-auth' || '' }}
          path: /tmp/artifacts/
          if-no-files-found: ignore

      - name: Cleanup
        if: always()
        run: |
          for id in $(ls /sys/bus/netdevsim/devices/ 2>/dev/null | sed 's/netdevsim//'); do
            echo "$id" | sudo tee /sys/bus/netdevsim/del_device 2>/dev/null || true
          done
          sudo rmmod netdevsim nsim_dpll nsim_ptp_mock nsim_ptp 2>/dev/null || true
          sudo dkms remove ${DKMS_PKG}/${DKMS_VER} --all 2>/dev/null || true

      - name: Summary
        if: always()
        run: |
          echo "## ptp-operator: ${{ matrix.mode }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- OS: ubuntu-24.04" >> "$GITHUB_STEP_SUMMARY"
          echo "- Kernel: $(uname -r)" >> "$GITHUB_STEP_SUMMARY"
