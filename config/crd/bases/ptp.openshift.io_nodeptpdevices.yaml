                      properties:
                        clockType:
                          description: ClockType is T-GM, T-BC, BC, or OC. Written
                            by linuxptp-daemon at apply.
                          type: string
                        name:
                          description: 'Name is the fully qualified profile name:
                            <ptpconfigName>_<profileName>.'
                          type: string
