---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: ptpconfigs.ptp.openshift.io
spec:
  group: ptp.openshift.io
  names:
    kind: PtpConfig
    listKind: PtpConfigList
    plural: ptpconfigs
    singular: ptpconfig
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="ProfileReferenceValid")].status
      name: Refs Valid
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: PtpConfig is the Schema for the ptpconfigs API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: PtpConfigSpec defines the desired state of PtpConfig
            properties:
              profile:
                items:
                  properties:
                    chronydConf:
                      type: string
                    chronydOpts:
                      type: string
                    interface:
                      type: string
                    name:
                      type: string
                    phc2sysConf:
                      type: string
                    phc2sysOpts:
                      type: string
                    plugins:
                      additionalProperties:
                        x-kubernetes-preserve-unknown-fields: true
                      type: object
                    ptp4lConf:
                      type: string
                    ptp4lOpts:
                      type: string
                    ptpClockThreshold:
                      properties:
                        holdOverTimeout:
                          default: 5
                          description: clock state to stay in holdover state in secs
                          format: int64
                          type: integer
                        maxOffsetThreshold:
                          default: 100
                          description: max offset in nano secs
                          format: int64
                          type: integer
                        minOffsetThreshold:
                          description: |-
                            DEPRECATED: min offset in nano secs. This field is no longer used for offset-range evaluation; the system now evaluates abs(offset) against maxOffsetThreshold only. The field is retained for backward compatibility with existing PtpConfig resources and its value is ignored. Do not set this field in new configurations.
                            Deprecated: MinOffsetThreshold is no longer used for offset-range evaluation; abs(offset) < MaxOffsetThreshold is evaluated instead.
                          format: int64
                          type: integer
                        processDowntimeThresholds:
                          description: Acceptable process downtime in seconds for
                            each process
                          properties:
                            chronyd:
                              default: 5
                              description: Acceptable downtime for chronyd process
                                in seconds (max 1 day)
                              maximum: 86400
                              minimum: 0
                              type: integer
                            gpsd:
                              default: 1
                              description: Acceptable downtime for gpsd process in
                                seconds (max 1 day)
                              maximum: 86400
                              minimum: 0
                              type: integer
                            gpspipe:
                              default: 1
                              description: Acceptable downtime for gpspipe process
                                in seconds (max 1 day)
                              maximum: 86400
                              minimum: 0
                              type: integer
                            phc2sys:
                              default: 5
                              description: Acceptable downtime for phc2sys process
                                in seconds (max 1 day)
                              maximum: 86400
                              minimum: 0
                              type: integer
                            ptp4l:
                              default: 5
                              description: Acceptable downtime for ptp4l process in
                                seconds (max 1 day)
                              maximum: 86400
                              minimum: 0
                              type: integer
                            synce4l:
                              default: 5
                              description: Acceptable downtime for synce4l process
                                in seconds (max 1 day)
                              maximum: 86400
                              minimum: 0
                              type: integer
                            ts2phc:
                              default: 5
                              description: Acceptable downtime for ts2phc process
                                in seconds (max 1 day)
                              maximum: 86400
                              minimum: 0
                              type: integer
                          type: object
                        sysOffsetInSyncThreshold:
                          description: sysOffsetInSyncThreshold is the phc2sys-to-CLOCK_REALTIME
                            offset threshold, in nanoseconds, that must be met to
                            gate the OS Clock Sync (E3) LOCKED state. abs(offset)
                            <= this threshold for sysOffsetSamples consecutive samples
                            triggers LOCKED. When unset, it defaults to maxOffsetThreshold.
                          format: int64
                          minimum: 0
                          type: integer
                        sysOffsetOutOfSyncThreshold:
                          description: sysOffsetOutOfSyncThreshold is the phc2sys-to-CLOCK_REALTIME
                            offset threshold, in nanoseconds, that when exceeded gates
                            the OS Clock Sync (E3) FREERUN state. abs(offset) > this
                            threshold for sysOffsetSamples consecutive samples triggers
                            FREERUN. Independent of sysOffsetInSyncThreshold; together
                            they form a hysteresis band. When unset, it defaults to
                            maxOffsetThreshold.
                          format: int64
                          minimum: 0
                          type: integer
                        sysOffsetSamples:
                          description: sysOffsetSamples is the number of consecutive
                            phc2sys offset samples required for an E3 LOCKED/FREERUN
                            state transition in either direction (relative to sysOffsetInSyncThreshold
                            for LOCKED, or sysOffsetOutOfSyncThreshold for FREERUN).
                            When unset, it defaults to 10.
                          format: int64
                          minimum: 1
                          type: integer
                      type: object
                    ptpSchedulingPolicy:
                      enum:
                      - SCHED_OTHER
                      - SCHED_FIFO
                      type: string
                    ptpSchedulingPriority:
                      format: int64
                      maximum: 65
                      minimum: 1
                      type: integer
                    ptpSettings:
                      additionalProperties:
                        type: string
                      description: |-
                        PtpSettings holds free-form, string-typed configuration knobs validated individually
                        by the PtpConfig admission webhook. Recognized keys include (non-exhaustive):
                          - logReduce: log reduction mode ('true', 'false', 'basic', 'enhanced').
                          - inSyncConditionThreshold: ptp4l offset threshold (ns) used by the T-BC state machine.
                          - inSyncConditionTimes: number of consecutive in-sync samples before T-BC reports LOCKED.
                          - stdoutFilter: regexp filtering ptp4l/phc2sys stdout.
                      type: object
                    synce4lConf:
                      type: string
                    synce4lOpts:
                      type: string
                    ts2phcConf:
                      type: string
                    ts2phcOpts:
                      type: string
                  required:
                  - name
                  type: object
                type: array
              recommend:
                items:
                  properties:
                    match:
                      items:
                        properties:
                          nodeLabel:
                            type: string
                          nodeName:
                            type: string
                        type: object
                      type: array
                    priority:
                      format: int64
                      type: integer
                    profile:
                      type: string
                  required:
                  - priority
                  - profile
                  type: object
                type: array
            required:
            - profile
            - recommend
            type: object
          status:
            description: PtpConfigStatus defines the observed state of PtpConfig
            properties:
              conditions:
                description: |-
                  Conditions represent the latest available observations of the PtpConfig's state.
                  Known condition types are: "ProfileReferenceValid".
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              matchList:
                description: MatchList contains the nodes matched by this PtpConfig's
                  recommend rules.
                items:
                  properties:
                    nodeName:
                      type: string
                    profile:
                      description: 'Profile is the fully qualified profile name: <ptpconfigName>_<profileName>.'
                      type: string
                  required:
                  - nodeName
                  - profile
                  type: object
                type: array
              observedGeneration:
                description: ObservedGeneration is the most recent generation observed
                  by the controller.
                format: int64
                type: integer
              profileStatuses:
                description: ProfileStatuses reports the relationship and apply state
                  of each profile in this PtpConfig.
                items:
                  description: ProfileStatus reports the relationship and apply state
                    of a single profile within this PtpConfig.
                  properties:
                    appliedOnNodes:
                      description: |-
                        AppliedOnNodes lists the nodes where the linuxptp-daemon has applied this profile.
                        This is observed from NodePtpDevice.status.sync.profiles, not from matchList.
                      items:
                        type: string
                      type: array
                    clockType:
                      description: ClockType is T-GM, T-BC, BC, or OC. Written by
                        linuxptp-daemon at apply.
                      type: string
                    controlledBy:
                      description: ControlledBy is the fully qualified name of the
                        profile that controls this one.
                      type: string
                    controls:
                      description: Controls lists the fully qualified names of profiles
                        this one controls (reverse of controllingProfile).
                      items:
                        type: string
                      type: array
                    haMembers:
                      description: HaMembers lists the fully qualified names of profiles
                        coordinated by this HA profile.
                      items:
                        type: string
                      type: array
                    hardwareConfigs:
                      description: HardwareConfigs lists HardwareConfig CRs whose
                        relatedPtpProfileName refers to this profile.
                      items:
                        type: string
                      type: array
                    hasPhc2sys:
                      description: HasPhc2sys is true if this profile has phc2sysOpts
                        configured (syncs system clock).
                      type: boolean
                    name:
                      description: 'Name is the fully qualified profile name: <ptpconfigName>_<profileName>.'
                      type: string
                    partOfHa:
                      description: |-
                        PartOfHa is the fully qualified name of the HA coordinator profile this one belongs to.
                        Empty if not part of HA.
                      type: string
                  required:
                  - hasPhc2sys
                  - name
                  type: object
                type: array
              warnings:
                description: Warnings contains any detected misconfigurations (e.g.,
                  multiple profiles with phc2sys on same node).
                items:
                  type: string
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
