apiVersion: apps/v1
kind: Deployment
metadata:
  name: ptp-operator
  namespace: openshift-ptp
spec:
  template:
    spec:
      containers:
        - name: ptp-operator
          env:
            - name: OPERATOR_NAME
              value: "ptp-operator"
            - name: RELEASE_VERSION
              value: "v5.0.0"
            - name: LINUXPTP_DAEMON_IMAGE
              value: "quay.io/openshift/origin-ptp:5.0"
            - name: KUBE_RBAC_PROXY_IMAGE
              value: "quay.io/openshift/origin-kube-rbac-proxy:5.0"
            - name: SIDECAR_EVENT_IMAGE
              value: "quay.io/openshift/origin-cloud-event-proxy:5.0"
            # If this is not empty, this signals to the operator that CEPv2 should be used, and CEPv1 should not be deployed.
            # The value should be equal to the image location.
            # The final naming/usage of this should be discussed before release.
            - name: EVENT_PROXY_IMAGE
              value: ""
            # Configures the verbosity (-v) of the linuxptp-daemon binary (glog V-level, 0..14).
            # An invalid or empty value falls back to the default "10".
            - name: LINUXPTP_VERBOSITY
              value: "10"
