apiVersion: v1
kind: ServiceAccount
metadata:
  name: linuxptp-daemon
  namespace: openshift-ptp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ptp-operator
  namespace: openshift-ptp
rules:
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["*"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["*"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["*"]
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["*"]
- apiGroups: [""]
  resources: ["services"]
  verbs: ["*"]
- apiGroups: [""]
  resources: ["serviceaccounts"]
  verbs: ["*"]
- apiGroups: ["apps"]
  resources: ["daemonsets"]
  verbs: ["*"]
- apiGroups: ["apps"]
  resources: ["replicasets"]
  verbs: ["*"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["*"]
- apiGroups: ["ptp.openshift.io"]
  resources: ["*"]
  verbs: ["*"]
- apiGroups: ["monitoring.coreos.com"]
  resources: ["servicemonitors"]
  verbs: ["*"]
- apiGroups: ["monitoring.coreos.com"]
  resources: ["prometheusrules"]
  verbs: ["*"]
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["roles"]
  verbs: ["*"]
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["rolebindings"]
  verbs: ["*"]
# The operator creates/removes the linuxptp-daemon-auth-delegator
# ClusterRoleBinding when event authentication is toggled.
# create/list/watch cannot be constrained by resourceNames (Kubernetes RBAC
# only honors resourceNames for get/update/patch/delete), and the cache-backed
# controller-runtime client needs cluster-wide list/watch on the type.
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["clusterrolebindings"]
  verbs: ["create", "list", "watch"]
# Mutating/reading the specific binding the operator owns is scoped by name.
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["clusterrolebindings"]
  resourceNames: ["linuxptp-daemon-auth-delegator"]
  verbs: ["get", "update", "patch", "delete"]
# Binding to system:auth-delegator requires the "bind" verb on it (RBAC
# escalation prevention), since the operator does not itself hold that role.
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["clusterroles"]
  resourceNames: ["system:auth-delegator"]
  verbs: ["bind"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: linuxptp-daemon
rules:
- apiGroups: ["ptp.openshift.io"]
  resources: ["*"]
  verbs: ["*"]
- apiGroups: ["authentication.k8s.io"]
  resources: ["tokenreviews"]
  verbs: ["create"]
- apiGroups: ["authorization.k8s.io"]
  resources: ["subjectaccessreviews"]
  verbs: ["create"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["*"]
- apiGroups: [ "" ]
  resources: [ "configmaps" ]
  verbs: [ "*" ]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ptp-operator
  namespace: openshift-ptp
roleRef:
  kind: ClusterRole
  name: ptp-operator
  apiGroup: rbac.authorization.k8s.io
subjects:
- kind: ServiceAccount
  name: ptp-operator
  namespace: openshift-ptp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: linuxptp-daemon
  namespace: openshift-ptp
roleRef:
  kind: ClusterRole
  name: linuxptp-daemon
  apiGroup: rbac.authorization.k8s.io
subjects:
- kind: ServiceAccount
  name: linuxptp-daemon
  namespace: openshift-ptp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: linuxptp-daemon
  namespace: openshift-ptp
rules:
  - apiGroups:
      - security.openshift.io
    resourceNames:
      - privileged
    resources:
      - securitycontextconstraints
    verbs:
      - use
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: linuxptp-daemon
  namespace: openshift-ptp
subjects:
- kind: ServiceAccount
  name: linuxptp-daemon
roleRef:
  kind: Role
  name: linuxptp-daemon
  apiGroup: rbac.authorization.k8s.io
