# Operator-pod policies (01-05). These select the normal-networked ptp-operator
# pod, so OVN-Kubernetes enforces them, unlike the host-networked linuxptp-daemon
# policies (06-13). Operator policies are numbered before the daemon set.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: 01-ptp-operator-default-deny
  namespace: openshift-ptp
spec:
  podSelector:
    matchLabels:
      name: ptp-operator
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: 02-ptp-operator-ingress-webhook
  namespace: openshift-ptp
spec:
  podSelector:
    matchLabels:
      name: ptp-operator
  ingress:
  # The kube-apiserver runs on the host network, so its webhook source address
  # cannot be matched by a pod or namespace selector; allow the webhook port.
  - ports:
    - port: 9443
      protocol: TCP
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: 03-ptp-operator-ingress-metrics
  namespace: openshift-ptp
spec:
  podSelector:
    matchLabels:
      name: ptp-operator
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: openshift-monitoring
    ports:
    - port: 8443
      protocol: TCP
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: 04-ptp-operator-egress-dns
  namespace: openshift-ptp
spec:
  podSelector:
    matchLabels:
      name: ptp-operator
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: openshift-dns
    ports:
    - port: 5353
      protocol: UDP
    - port: 5353
      protocol: TCP
  policyTypes:
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: 05-ptp-operator-egress-api-server
  namespace: openshift-ptp
spec:
  podSelector:
    matchLabels:
      name: ptp-operator
  egress:
  # The API server host IP is not known ahead of time, so this is a port-based
  # rule (TCP 6443, the API server target port) with no destination peer.
  - ports:
    - port: 6443
      protocol: TCP
  policyTypes:
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: 06-linuxptp-daemon-default-deny
  namespace: openshift-ptp
spec:
  podSelector:
    matchLabels:
      app: linuxptp-daemon
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: 07-linuxptp-daemon-egress-dns
  namespace: openshift-ptp
spec:
  podSelector:
    matchLabels:
      app: linuxptp-daemon
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: openshift-dns
    ports:
    - port: 5353
      protocol: UDP
    - port: 5353
      protocol: TCP
  policyTypes:
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: 08-linuxptp-daemon-egress-api-server
  namespace: openshift-ptp
spec:
  podSelector:
    matchLabels:
      app: linuxptp-daemon
  egress:
  # The API server host IP is not known ahead of time, so this is a port-based
  # rule (TCP 6443, the API server target port) with no destination peer.
  - ports:
    - port: 6443
      protocol: TCP
  policyTypes:
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: 09-linuxptp-daemon-ptp-traffic
  namespace: openshift-ptp
spec:
  podSelector:
    matchLabels:
      app: linuxptp-daemon
  ingress:
  - ports:
    - port: 319
      protocol: UDP
    - port: 320
      protocol: UDP
  egress:
  - ports:
    - port: 319
      protocol: UDP
    - port: 320
      protocol: UDP
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: 11-linuxptp-daemon-ingress-metrics
  namespace: openshift-ptp
spec:
  podSelector:
    matchLabels:
      app: linuxptp-daemon
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: openshift-monitoring
    ports:
    - port: 8443
      protocol: TCP
  policyTypes:
  - Ingress
